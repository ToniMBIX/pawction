services:
  mysql:
    image: mysql:8.0
    container_name: pawction_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pawction
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: pawction
      MYSQL_PASSWORD: pawction
    ports:
      - "3307:3306"
    volumes:
      - pawction_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: pawction_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Pawction
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pawction
      DB_USERNAME: pawction
      DB_PASSWORD: pawction
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      STRIPE_KEY: pk_test_RELLENAR
      STRIPE_SECRET: sk_test_RELLENAR
      STRIPE_WEBHOOK_SECRET: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_STORAGE_BUCKET: pawction
      MAIL_MAILER: log
    volumes:
      - ./backend:/var/www/html
    command: sh -c "composer install && php artisan key:generate --force && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: pawction_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pawction_mysql_data:
